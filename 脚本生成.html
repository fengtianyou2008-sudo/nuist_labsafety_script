<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成脚本 · 南信大安全平台自动连播</title>
<style>
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#222;line-height:1.7}
  h1{font-size:22px;margin-bottom:6px}
  label{display:block;margin-top:18px;font-weight:600;font-size:14px}
  .hint{font-weight:400;color:#777;font-size:12px}
  input,select{width:100%;box-sizing:border-box;padding:9px 11px;margin-top:6px;border:1px solid #ccd;border-radius:8px;font-size:14px}
  button{margin-top:22px;padding:11px 20px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
  button:hover{background:#1d4fd8}
  .tip{margin-top:22px;padding:12px 14px;background:#fff7e6;border:1px solid #ffe0a3;border-radius:8px;font-size:13px;color:#7a4b00}
  .ok{margin-top:16px;color:#0a7a35;font-size:14px}
</style>
</head>
<body>
  <h1>生成自动连播脚本</h1>

  <label>ZError 地址 <span class="hint">（填地址或粘贴 OCS 配置 JSON；留空 = 不启用）</span></label>
  <input id="ze" placeholder="例如 http://127.0.0.1:3000/query">

  <label>言溪题库 token <span class="hint">（留空 = 不内置）</span></label>
  <input id="yx" placeholder="32 位 token">

  <label>DeepSeek API Key <span class="hint">（可选，留空 = 不内置）</span></label>
  <input id="ai" placeholder="sk-...">

  <label>播放倍速</label>
  <select id="rate">
    <option value="4">4×（稳）</option>
    <option value="8" selected>8×（推荐）</option>
    <option value="16">16×（最快，可能被平台限速）</option>
  </select>

  <button onclick="gen()">生成并下载脚本</button>
  <div id="msg" class="ok"></div>

  <div class="tip">
    答题顺序：<b>ZError → 言溪 → DeepSeek</b>（哪层有结果就用哪层）。<br>
    注意：填进去的 token / key 会<b>明文写进脚本</b>，任何拿到脚本的人都能看到。只发给可信的人。
  </div>

  <script type="text/plain" id="tpl">// ==UserScript==
// @name         南信大·实验室安全平台 自动连播（生成版）
// @namespace    local.sakt.generated
// @version      3.0
// @description  倍速播放、自动切节、考试/练习自动答题；ZError → 言溪 → DeepSeek → 本地题库
// @match        https://sakt.nuist.edu.cn/*
// @run-at       document-idle
// @grant        GM_xmlhttpRequest
// @grant        GM_registerMenuCommand
// @grant        unsafeWindow
// @connect      tk.enncy.cn
// @connect      api.deepseek.com
// @connect      127.0.0.1
// @connect      localhost
// ==/UserScript==

/*
 * 与普通版的唯一区别：答题时先查言溪，查不到再查本地题库。
 * 其余完全一致：8 倍速、静音、播完切节、跨大章展开、视频弹题、考试/练习界面。
 *
 * 首次使用：Tampermonkey 图标 →「设置言溪题库配置」→ 粘贴整段 OCS 配置或 32 位 token。
 * 不填也能用，只是答题全走本地题库。
 */
(function () {
  'use strict';

  // 有 @grant 时脚本跑在隔离环境，window 不是页面真实 window
  const PAGE = (typeof unsafeWindow !== 'undefined' && unsafeWindow) ? unsafeWindow : window;

  if (PAGE.__sakt) {
    console.log('[sakt] 已在运行；要重载请刷新页面');
    return;
  }

  const CONFIG = {
    rate: 8,
    autoNext: true,
    mute: true,
    tickMs: 1500,
    answerQuiz: true,
    bankUrl: '__BANK_URL__',   // 本地题库（可选；留空=不启用）
    yanxiTimeout: 15000,
    zerrorTimeout: 20000,
    // ↓ 生成器写入的默认值（可在控制台改，或菜单重新设置）
    defaultYanxiToken: '__YANXI_TOKEN__',
    defaultAiKey: '__AI_KEY__',
    defaultZerrorUrl: '__ZERROR_URL__',
    aiModel: 'deepseek-chat',
    aiTimeout: 20000,
  };

  // ---------- ZError 本地服务（第一层） ----------
  const ZERROR_URL_KEY = 'sakt_zerror_url';

  function getZerrorUrl() {
    try {
      const u = localStorage.getItem(ZERROR_URL_KEY);
      if (u && /^https?:\/\//.test(u)) return u;
    } catch (e) {}
    const d = CONFIG.defaultZerrorUrl || '';
    return (d && !d.startsWith('__') && /^https?:\/\//.test(d)) ? d : '';
  }

  function askZerror(title, optionsText, qtype) {
    return new Promise((resolve) => {
      const url = getZerrorUrl();
      if (!url || typeof GM_xmlhttpRequest !== 'function') return resolve('');
      GM_xmlhttpRequest({
        method: 'POST',
        url,
        headers: { 'Content-Type': 'application/json' },
        data: JSON.stringify({ title, options: optionsText, type: qtype }),
        timeout: CONFIG.zerrorTimeout,
        onload: (res) => {
          try {
            const d = JSON.parse(res.responseText);
            if (d && Number(d.code) === 1 && d.data && d.data.answer) {
              return resolve(String(d.data.answer));
            }
            resolve('');
          } catch (e) { resolve(''); }
        },
        onerror: () => resolve(''),
        ontimeout: () => resolve(''),
      });
    });
  }

  // ---------- DeepSeek 直连（第二层兜底） ----------
  const AI_KEY_STORE = 'sakt_ai_key';

  function getAiKey() {
    try {
      return localStorage.getItem(AI_KEY_STORE) || CONFIG.defaultAiKey || '';
    } catch (e) { return CONFIG.defaultAiKey || ''; }
  }

  function setAiKey(k) {
    try {
      if (k) localStorage.setItem(AI_KEY_STORE, k);
      else localStorage.removeItem(AI_KEY_STORE);
    } catch (e) {}
  }

  function askDeepSeek(title, optionsText, qtype) {
    return new Promise((resolve) => {
      const key = getAiKey();
      if (!key || key.startsWith('__')) return resolve('');
      if (typeof GM_xmlhttpRequest !== 'function') return resolve('');

      const typeLabel = { single: '单选题', multiple: '多选题', judgement: '判断题', completion: '填空题' }[qtype] || '题目';
      const prompt =
        '题型：' + typeLabel + '\n题目：' + title + '\n选项：\n' + optionsText +
        '\n\n只输出最终答案：单选写一个字母（如 B）；多选按字母顺序用 # 分隔（如 A#C）；' +
        '判断题只写「正确」或「错误」；填空题只写答案本身。不要解释。';

      GM_xmlhttpRequest({
        method: 'POST',
        url: 'https://api.deepseek.com/chat/completions',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        data: JSON.stringify({
          model: CONFIG.aiModel,
          messages: [
            { role: 'system', content: '你只输出答案本身，不要解释。' },
            { role: 'user', content: prompt },
          ],
          temperature: 0,
          max_tokens: 60,
        }),
        timeout: CONFIG.aiTimeout,
        onload: (res) => {
          try {
            const d = JSON.parse(res.responseText);
            const text = d && d.choices && d.choices[0] && d.choices[0].message &&
              d.choices[0].message.content;
            resolve(text ? String(text).trim() : '');
          } catch (e) { resolve(''); }
        },
        onerror: () => resolve(''),
        ontimeout: () => resolve(''),
      });
    });
  }

  // ---------- 言溪配置 ----------
  const YANXI_KEY = 'sakt_yanxi_token';
  const YANXI_URL_KEY = 'sakt_yanxi_url';
  const DEFAULT_YANXI_URL = 'https://tk.enncy.cn/query';
  const str = (v) => (typeof v === 'string' ? v.trim() : '');

  function getYanxi() {
    try {
      const t = localStorage.getItem(YANXI_KEY);
      if (t) return t;
    } catch (e) {}
    const d = CONFIG.defaultYanxiToken || '';
    return (d && !d.startsWith('__')) ? d : '';
  }
  function setYanxi(token) {
    try {
      if (token) localStorage.setItem(YANXI_KEY, token);
      else localStorage.removeItem(YANXI_KEY);
    } catch (e) {}
  }
  function getYanxiUrl() {
    try {
      const u = localStorage.getItem(YANXI_URL_KEY) || '';
      if (/^https?:\/\//.test(u)) return u;
    } catch (e) {}
    return DEFAULT_YANXI_URL;
  }
  function setYanxiUrl(url) {
    try {
      if (url && /^https?:\/\//.test(url)) localStorage.setItem(YANXI_URL_KEY, url);
      else localStorage.removeItem(YANXI_URL_KEY);
    } catch (e) {}
  }

  // 支持：整段 OCS 配置数组 / 单个配置对象 / 纯 token
  function parseYanxiInput(text) {
    const raw = String(text || '').trim();
    if (!raw) return { token: '', url: '' };
    const fromObject = (obj) => {
      if (!obj || typeof obj !== 'object') return null;
      const token = str(obj.token) || str(obj.data && obj.data.token);
      const url = str(obj.url);
      return (token || url) ? { token, url } : null;
    };
    if (raw.startsWith('[') || raw.startsWith('{')) {
      try {
        const parsed = JSON.parse(raw);
        const list = Array.isArray(parsed) ? parsed : [parsed];
        const hits = list.map(fromObject).filter(Boolean);
        hits.sort((a, b) => (/enncy/.test(b.url) ? 1 : 0) - (/enncy/.test(a.url) ? 1 : 0));
        if (hits.length) return hits[0];
      } catch (e) {}
    }
    return { token: raw, url: '' };
  }

  function askYanxiToken() {
    const cur = getYanxi();
    const t = prompt(
      '粘贴言溪配置（整段 JSON 或只填 token 都行）\n留空 = 清除\n\n当前：' +
      (cur ? cur.slice(0, 4) + '****' : '未设置'),
      cur
    );
    if (t === null) return;
    const p = parseYanxiInput(t);
    setYanxi(p.token);
    setYanxiUrl(p.url);
    console.log('%c[sakt]', 'color:#0a0',
      p.token ? ('言溪已保存：' + p.token.slice(0, 4) + '**** @ ' + getYanxiUrl()) : '言溪配置已清除');
  }

  // 返回 { answer, code, error }：区分「没收录」和「请求失败」
  function askYanxi(title, optionsText, qtype) {
    return new Promise((resolve) => {
      const token = getYanxi();
      if (!token || typeof GM_xmlhttpRequest !== 'function') {
        return resolve({ answer: '', code: -1, error: '未配置 token' });
      }
      GM_xmlhttpRequest({
        method: 'POST',
        url: getYanxiUrl(),
        headers: { 'Content-Type': 'application/json' },
        data: JSON.stringify({
          token, title, options: optionsText, type: qtype, v: '2',
          images: [], suggestion_title: '', suggestion_options: '',
        }),
        timeout: CONFIG.yanxiTimeout,
        onload: (res) => {
          try {
            const d = JSON.parse(res.responseText);
            if (d && d.code === 1 && d.data && d.data.answer) {
              return resolve({ answer: String(d.data.answer), code: 1, error: '' });
            }
            resolve({ answer: '', code: (d && Number(d.code)) || 0, error: '' });
          } catch (e) {
            resolve({ answer: '', code: -1, error: '返回不是 JSON' });
          }
        },
        onerror: () => resolve({ answer: '', code: -1, error: '网络错误（可能被拦）' }),
        ontimeout: () => resolve({ answer: '', code: -1, error: '超时' }),
      });
    });
  }

  let running = true;
  let currentKey = '';
  let switching = false;
  let lastEndAt = 0;
  const handled = new Map();

  const log = (...a) => console.log('%c[sakt]', 'color:#0a0', ...a);
  const warn = (...a) => console.warn('%c[sakt]', 'color:#c60', ...a);

  // ---------- 视频 ----------
  const findVideo = () => document.querySelector('video');

  function videoKey(video) {
    if (!video) return '';
    const src = decodeURIComponent(video.currentSrc || video.src || '');
    const m = src.match(/(JC[A-Z]{2}\d+)/);
    return m ? m[1] : '';
  }

  function ensurePlaying() {
    const v = findVideo();
    if (!v) return;
    const key = videoKey(v);
    if (key && key !== currentKey) {
      currentKey = key;
      switching = false;
      log('当前章节：' + key + '，时长 ' + Math.round(v.duration || 0) + 's');
    }
    if (Math.abs(v.playbackRate - CONFIG.rate) > 0.01) {
      v.playbackRate = CONFIG.rate;
      log('倍速 → ' + CONFIG.rate + 'x');
    }
    if (CONFIG.mute && !v.muted) v.muted = true;
    if (v.paused && !v.ended && running) {
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    }
  }

  // ---------- 章节列表 ----------
  // 章节条目的状态可能是 (未学) (学完) (学习中) (88%) 这几种，都要认
  const STATUS_RE = /[（(]\s*(?:未学|学完|学习中|\d+%)\s*[）)]/;

  function chapterNodes() {
    const all = [];
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT, null);
    while (walker.nextNode()) {
      const el = walker.currentNode;
      if (!el || !el.innerText) continue;
      const t = el.innerText.replace(/\s+/g, ' ').trim();
      if (t.length < 6 || t.length > 120) continue;
      if (!/《[^》]+》/.test(t)) continue;
      if (!STATUS_RE.test(t)) continue;     // 没有状态标记的（比如视频标题）不算
      all.push(el);
    }
    return all.filter((n) => !all.some((m) => m !== n && n.contains(m)));
  }

  const nodeText = (el) => (el.innerText || '').replace(/\s+/g, ' ').trim();

  function findNextUnlearned(fromKey) {
    const nodes = chapterNodes();
    if (!nodes.length) return null;
    let startIdx = -1;
    if (fromKey) startIdx = nodes.findIndex((n) => nodeText(n).includes(fromKey));
    for (let i = startIdx + 1; i < nodes.length; i++) {
      if (!/学完/.test(nodeText(nodes[i]))) return nodes[i];
    }
    if (startIdx === -1) {
      for (const n of nodes) {
        if (!/学完/.test(nodeText(n))) return n;
      }
    }
    return null;
  }

  // 折叠的分类：文字恰好等于分类名
  const CATEGORIES = ['水电安全', '消防安全', '特种设备', '应急处置', '安全防护',
    '用气安全', '试剂安全', '安全手册', '应急演练', '化学化工'];

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function categoryCandidates(name) {
    // 标题里可能带 ▶ 图标、计数等，用“包含”而不是“完全等于”，并排除章节条目本身
    return [...document.querySelectorAll('div,li,span,a,button')].filter((el) => {
      const t = (el.innerText || '').replace(/\s+/g, '');
      if (!t || t.includes('《')) return false;
      if (t.length > name.length + 6) return false;
      return t === name || t.endsWith(name) || t.startsWith(name);
    });
  }

  function categoryEl(name) {
    const cands = categoryCandidates(name);
    return cands.length ? cands[cands.length - 1] : null;
  }

  function targetsFor(cand) {
    const list = [cand];
    let p = cand.parentElement;
    for (let i = 0; i < 2 && p; i++) {
      list.push(p);
      p = p.parentElement;
    }
    // 箭头图标有时单独绑事件
    const icon = cand.querySelector('i,svg,.icon,.arrow,[class*=arrow],[class*=icon]');
    if (icon) list.push(icon);
    return list;
  }

  // 只点一次，然后数条目：变多=展开成功，变少=误收起（点回去），不变=没反应
  async function tryClickOnce(el) {
    const before = chapterNodes().length;
    try { el.click(); } catch (e) { return 'error'; }
    await sleep(750);
    const after = chapterNodes().length;
    if (after > before) return 'opened';
    if (after < before) {
      try { el.click(); } catch (e) {}
      await sleep(500);
      return 'collapsed';
    }
    return 'nochange';
  }

  async function expandAllCategories() {
    let opened = 0;
    for (const name of CATEGORIES) {
      const cands = categoryCandidates(name).slice(-3);
      if (!cands.length) continue;

      let done = false;
      for (const cand of cands) {
        for (const el of targetsFor(cand)) {
          const r = await tryClickOnce(el);
          if (r === 'opened') {
            opened++;
            log('展开分类：' + name);
            done = true;
            break;
          }
        }
        if (done) break;
      }
    }
    if (!opened) {
      log('自动展开失败：请手动点开左侧各分类（一次即可），脚本会接着跑');
    }
    return opened;
  }

  function onEnded() {
    if (!running || !CONFIG.autoNext) return;
    const now = Date.now();
    if (now - lastEndAt < 8000) return;
    lastEndAt = now;
    if (switching) return;
    switching = true;
    const key = currentKey;
    setTimeout(async () => {
      let next = findNextUnlearned(key);
      if (!next) {
        // 本节分类可能已全部学完：把所有分类展开一次再找
        const opened = await expandAllCategories();
        if (opened) next = findNextUnlearned(key);
      }
      if (!next) {
        log('没有更多未学章节了');
        switching = false;
        return;
      }
      log('切到下一节：' + nodeText(next).slice(0, 40));
      next.scrollIntoView({ block: 'center' });
      next.click();
      setTimeout(() => { switching = false; }, 5000);
    }, 4000);
  }

  function bindVideo() {
    const v = findVideo();
    if (v && !v.__saktBound) {
      v.__saktBound = true;

      // 播放器在加载新视频/某些操作后会把倍速重置成 1，这里立刻纠正
      const fixRate = (why) => {
        if (!running) return;
        if (Math.abs(v.playbackRate - CONFIG.rate) > 0.01) {
          v.playbackRate = CONFIG.rate;
          console.log('%c[sakt]', 'color:#0a0', '倍速被重置（' + why + '），已恢复 ' + CONFIG.rate + 'x');
        }
      };

      v.addEventListener('ratechange', () => fixRate('ratechange'));
      v.addEventListener('loadedmetadata', () => fixRate('loadedmetadata'));
      v.addEventListener('canplay', () => fixRate('canplay'));
      v.addEventListener('play', () => fixRate('play'));
      v.addEventListener('seeked', () => fixRate('seeked'));

      v.addEventListener('ended', onEnded);
      v.addEventListener('timeupdate', () => {
        if (v.duration && v.currentTime > v.duration - 1.2) onEnded();
      });
      log('已绑定视频事件');
    }
  }

  // 切回标签页时也立刻纠正一次
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && running) {
      try { ensurePlaying(); } catch (e) {}
    }
  });

  // ---------- 弹题 ----------
  function extractQuiz() {
    const sub = document.querySelector('form .sub-title');
    if (!sub) return null;
    const form = sub.closest('form');
    if (!form) return null;

    // 题型：从 "(单选题)" / "(多选题)" / "(判断题)" 里取
    const typeEl = sub.querySelector('.type');
    const typeText = typeEl ? (typeEl.innerText || '') : '';

    let title = (sub.innerText || '').replace(/\s+/g, ' ').trim();
    title = title.replace(/^[（(]\s*(?:单选题|多选题|判断题)\s*[)）]\s*/, '').trim();

    const rows = [...form.querySelectorAll('.ant-radio-group .mb-12, .ant-checkbox-group .mb-12')];
    const opts = rows.map((row) => {
      const letterEl = row.querySelector('.letter');
      const textEl = row.querySelector('.option');
      const input = row.querySelector('input');
      return {
        letter: letterEl ? (letterEl.innerText || '').replace(/[:：\s]/g, '') : '',
        text: textEl ? (textEl.innerText || '').trim() : '',
        input,
        kind: input ? String(input.type || '').toLowerCase() : '',
      };
    }).filter((o) => o.letter && o.input);

    // 题型判断：勾选框(checkbox)出现就是多选，比文字更可靠
    const hasCheckbox = !!form.querySelector('.ant-checkbox-group')
      || opts.some((o) => o.kind === 'checkbox');
    let qtype = 'single';
    if (hasCheckbox || /多选/.test(typeText)) qtype = 'multiple';
    else if (/判断/.test(typeText)) qtype = 'judgement';

    return { form, title, qtype, opts, submit: form.querySelector('button.ant-btn-primary') };
  }

  function bankEnabled() {
    const u = CONFIG.bankUrl || '';
    return u && !u.startsWith('__');
  }

  async function askBank(title, optionsText, qtype) {
    const url = CONFIG.bankUrl || '';
    if (!url || url.indexOf('__BANK_URL__') >= 0) return '';   // 没启用就静默跳过
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        options: optionsText,
        type: qtype,
        v: '2',
        token: 'local-dev-token',
      }),
    });
    const data = await res.json();
    if (!data || data.code !== 0) return '';
    return String((data.data && data.data.answer) || '');
  }

  // 勾选一个选项：input → 内层方框 → label，逐级重试并等 React 渲染
  async function checkOption(opt) {
    const input = opt && opt.input;
    if (!input) return false;
    if (input.checked) return true;

    const label = input.closest('label');
    const inner = label ? label.querySelector('.ant-checkbox-inner, .ant-radio-inner') : null;

    const tries = [input, inner, label].filter(Boolean);
    for (const el of tries) {
      try { el.click(); } catch (e) {}
      await sleep(180);
      if (input.checked) return true;
    }
    return input.checked;
  }

  let quizBusy = false;

  async function handleQuiz() {
    if (!CONFIG.answerQuiz || quizBusy) return;
    const q = extractQuiz();
    if (!q) return;
    if (!q.opts.length) return;

    const key = q.title;
    const last = handled.get(key) || 0;
    if (Date.now() - last < 20000) return;
    handled.set(key, Date.now());
    quizBusy = true;

    try {
      log('发现弹题（' + q.qtype + '）：' + q.title.slice(0, 50) + '（选项 ' + q.opts.length + ' 个）');
      const optionsText = q.opts.map((o) => o.letter + '. ' + o.text).join('\n');

      let letters = [];
      let from = '';

      // ① ZError（本机 3000 端口）
      if (getZerrorUrl()) {
        const ze = await askZerror(q.title, optionsText, q.qtype);
        if (ze) {
          letters = mapLetters(ze, q.opts, q.qtype);
          if (letters.length) from = 'ZError';
          else warn('ZError 返回「' + ze + '」映射不到选项');
        }
      }

      // ② 言溪
      if (!letters.length && getYanxi()) {
        const yr = await askYanxi(q.title, optionsText, q.qtype);
        if (yr.answer) {
          letters = mapLetters(yr.answer, q.opts, q.qtype);
          if (letters.length) from = '言溪';
          else warn('言溪返回「' + yr.answer + '」映射不到选项');
        } else if (yr.error) {
          warn('言溪请求失败：' + yr.error);
        } else {
          warn('言溪没收录这题（code=' + yr.code + '）');
        }
      }

      // ③ DeepSeek 直连
      if (!letters.length && getAiKey()) {
        const ai = await askDeepSeek(q.title, optionsText, q.qtype);
        if (ai) {
          letters = mapLetters(ai, q.opts, q.qtype);
          if (letters.length) from = 'DeepSeek';
        }
      }

      // ④ 本地题库（只有启用时才连）
      if (!letters.length && bankEnabled()) {
        try {
          const ans = await askBank(q.title, optionsText, q.qtype);
          if (ans) {
            letters = mapLetters(ans, q.opts, q.qtype);
            if (letters.length) from = '本地题库';
            else warn('本地题库返回「' + ans + '」映射不到选项');
          }
        } catch (e) {
          warn('查本地题库失败：' + e.message + '（8765 服务没开？）');
        }
      }

      if (!letters.length) {
        warn('所有题库都没给出答案（ZError/言溪/DeepSeek/本地），这题请手动选');
        return;
      }

      let clicked = 0;
      for (const L of letters) {
        const hit = q.opts.find((o) => o.letter === L);
        if (!hit || !hit.input) continue;
        if (await checkOption(hit)) clicked++;
      }
      // 复查：没勾上的补点一次（antd 受控组件连续点击会被合并）
      const missing = letters.filter((L) => {
        const hit = q.opts.find((o) => o.letter === L);
        return hit && hit.input && !hit.input.checked;
      });
      if (missing.length) {
        warn('这些选项没勾上：' + missing.join(',') + '，重试');
        for (const L of missing) {
          const hit = q.opts.find((o) => o.letter === L);
          if (hit) await checkOption(hit);
        }
      }
      const state = q.opts.map((o) => o.letter + ':' + (o.input.checked ? '✓' : '✗')).join(' ');
      log('来源=' + from + ' 题型=' + q.qtype + ' 要选=' + letters.join('') + ' 勾选状态=[' + state + ']');
      if (!clicked) {
        warn('答案对不上选项，跳过');
        return;
      }
      log('已选 ' + letters.join('') + '（' + q.qtype + '，来自' + from + '），500ms 后提交');
      await new Promise((r) => setTimeout(r, 500));
      if (q.submit) {
        q.submit.click();
        log('已点提交');
      } else {
        warn('没找到提交按钮');
      }
    } finally {
      quizBusy = false;
    }
  }

  // ---------- 考试 / 练习界面（“第N题 / 下一题 / 提交”） ----------
  function findPracticeModal() {
    const divs = [...document.querySelectorAll('div')];
    let best = null;
    let bestLen = Infinity;
    for (const el of divs) {
      const t = el.innerText || '';
      if (!/第\s*\d+\s*题/.test(t)) continue;
      if (el.querySelectorAll('input[type=radio], input[type=checkbox]').length < 2) continue;
      const hasBtn = [...el.querySelectorAll('button')]
        .some((b) => /下一题|提交|确定/.test(b.innerText || ''));
      if (!hasBtn) continue;
      if (t.length < bestLen) { bestLen = t.length; best = el; }
    }
    return best;
  }

  function extractPractice() {
    const modal = findPracticeModal();
    if (!modal) return null;
    const full = (modal.innerText || '').replace(/\s+/g, ' ').trim();
    const m = full.match(/第\s*\d+\s*题\s*[:：]?\s*(?:[（(]\s*(判断题|单选题|多选题)\s*[)）])?\s*(.*)$/);
    if (!m) return null;

    let qtype = 'single';
    if (m[1] === '判断题') qtype = 'judgement';
    else if (m[1] === '多选题') qtype = 'multiple';

    const title = m[2].split(/\s*[A-E]\s*[:：]/)[0].trim();
    if (!title) return null;

    const labels = [...modal.querySelectorAll('label.ant-radio-wrapper, label.ant-checkbox-wrapper')];
    const opts = labels.map((label) => {
      const input = label.querySelector('input');
      const row = label.parentElement || label;
      const letterEl = row.querySelector ? row.querySelector('.letter') : null;
      let letter = letterEl ? (letterEl.innerText || '').replace(/[:：\s]/g, '') : '';
      if (!letter) {
        const mm = (row.innerText || '').match(/^\s*([A-Z])\s*[:：]/);
        if (mm) letter = mm[1];
      }
      const text = (label.innerText || '').replace(/^\s*[A-Z]\s*[:：]\s*/, '').trim();
      return { letter, text, input, kind: input ? String(input.type).toLowerCase() : '' };
    }).filter((o) => o.letter && o.input && o.text);

    const btn = [...modal.querySelectorAll('button')]
      .find((b) => /下一题|提交|确定/.test(b.innerText || ''));
    return { modal, title, qtype, opts, submit: btn };
  }

  function mapLetters(ans, opts, qtype) {
    const raw = String(ans || '').replace(/###/g, '#').trim();
    if (!raw) return [];
    const norm = (s) => String(s || '').replace(/\s+/g, '').replace(/[。，,．.]$/, '');
    const parts = raw.split(/[#、,，;；\n]+/).map((s) => s.trim()).filter(Boolean);
    const out = [];
    for (const part of parts) {
      const compact = norm(part);
      if (/^[A-Z]$/i.test(compact) && opts.some((o) => o.letter === compact.toUpperCase())) {
        const L = compact.toUpperCase();
        if (!out.includes(L)) out.push(L);
        continue;
      }
      const p = compact.replace(/^[A-Za-z][.、)）:：]/, '');
      const hit = opts.find((o) => norm(o.text) === p)
        || opts.find((o) => norm(o.text).includes(p))
        || opts.find((o) => p && p.includes(norm(o.text)));
      if (hit && !out.includes(hit.letter)) out.push(hit.letter);
    }
    if (out.length) return out;

    if (/正确|对|true/i.test(raw)) {
      const h = opts.find((o) => /正确|对|true/i.test(o.text));
      if (h) return [h.letter];
    }
    if (/错误|错|false/i.test(raw)) {
      const h = opts.find((o) => /错误|错|false/i.test(o.text));
      if (h) return [h.letter];
    }
    return [];
  }

  // 兜底：不看 input，直接抓页面上可见的选项标签行（antd 的 label 才是可见的）
  function extractPracticeGlobal() {
    const labels = [...document.querySelectorAll('.ant-radio-wrapper, .ant-checkbox-wrapper, label')]
      .filter((el) => {
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.height > 0 && el.querySelector('input');
      });

    const opts = [];
    for (const label of labels) {
      const input = label.querySelector('input');
      const row = label.parentElement || label;
      // 选项行文字形如 "A： 正确"（字母是文本，文字在 label 外面的 span 里）
      const rowText = ((row.innerText || '')).replace(/\s+/g, ' ').trim();
      const lm = rowText.match(/^\s*([A-Z])\s*[:：]\s*(.*)$/);
      if (!lm) continue;
      const letter = lm[1];
      const text = lm[2].trim();
      if (letter && text && !opts.some((o) => o.letter === letter)) {
        opts.push({ letter, text, input, kind: input ? input.type : '' });
      }
    }

    // 题干：优先 .stem
    let title = '';
    const stemEl = document.querySelector('.stem, .question-stem, .stem-content');
    if (stemEl) {
      title = (stemEl.innerText || '')
        .replace(/\s+/g, ' ')
        .replace(/^第\s*\d+\s*题\s*[:：]?\s*/, '')
        .replace(/[（(]\s*(判断题|单选题|多选题)\s*[)）]/, '')
        .trim();
    }
    if (!title) {
      const bodyText = (document.body.innerText || '').replace(/\s+/g, ' ');
      const bm = bodyText.match(/第\s*\d+\s*题\s*[:：]?\s*(?:[（(]\s*(判断题|单选题|多选题)\s*[)）])?\s*([\s\S]*)$/);
      if (bm) {
        const body = (bm[2] || '').split(/\s*[A-E]\s*[:：]/)[0].trim();
        if (body) title = body;
      }
    }

    if (!title || opts.length < 2) {
      // 页面上根本没有考题（例如课程视频页）就别刷日志了
      const hasQuestion = !!document.querySelector('.stem')
        || /第\s*\d+\s*题/.test(document.body.innerText || '');
      if (!hasQuestion) return null;

      const nAll = document.querySelectorAll('input[type=radio], input[type=checkbox]').length;
      const nLabel = labels.length;
      if (Date.now() - lastDiag > 8000) {
        lastDiag = Date.now();
        const firstRow = labels[0] ? (labels[0].parentElement || labels[0]) : null;
        const rowTxt = firstRow ? (firstRow.innerText || '').replace(/\s+/g, ' ').slice(0, 40) : '-';
        const stemN = document.querySelectorAll('.stem').length;
        const stemTxt = stemN ? (document.querySelector('.stem').innerText || '').replace(/\s+/g, ' ').slice(0, 40) : '-';
        warn('识别失败：input ' + nAll + '，行 ' + nLabel + '，选项 ' + opts.length +
          '，题干 ' + title.length + '；首行=[' + rowTxt + ']；.stem=' + stemN + ' [' + stemTxt + ']');
      }
      return null;
    }

    let qtype = 'single';
    for (const el of document.querySelectorAll('div,p,li,section,span')) {
      const t = (el.innerText || '').replace(/\s+/g, ' ').trim();
      if (t.length > 200) continue;
      const m = t.match(/[（(]\s*(判断题|单选题|多选题)\s*[)）]/);
      if (m) {
        if (m[1] === '判断题') qtype = 'judgement';
        else if (m[1] === '多选题') qtype = 'multiple';
        break;
      }
    }
    if (opts.some((o) => o.kind === 'checkbox')) qtype = 'multiple';

    const submit = [...document.querySelectorAll('button')]
      .filter((b) => b.getBoundingClientRect().width > 0)
      .find((b) => /下一题|提交|确定/.test(b.innerText || ''));

    return { title, qtype, opts, submit, modal: null };
  }

  let practiceBusy = false;
  let lastDiag = 0;
  async function handlePractice() {
    if (!CONFIG.answerQuiz || practiceBusy) return;
    let q = extractPractice();
    // 弹窗解析器在考试页会返回“空选项对象”，不能让它挡住全局解析
    if (!q || !q.opts.length) {
      const g = extractPracticeGlobal();
      if (g && g.opts.length) q = g;
    }
    if (!q || !q.opts.length) return;   // 诊断日志已在 extractPracticeGlobal 里，且只在有考题时才打

    const key = 'P|' + q.title;
    const last = handled.get(key) || 0;
    if (Date.now() - last < 20000) return;
    handled.set(key, Date.now());
    practiceBusy = true;

    try {
      log('考试/练习（' + q.qtype + '）：' + q.title.slice(0, 40) + '（选项 ' + q.opts.length + ' 个）');
      const optionsText = q.opts.map((o) => o.letter + '. ' + o.text).join('\n');

      let letters = [];
      let from = '';

      // ① ZError
      if (getZerrorUrl()) {
        const ze = await askZerror(q.title, optionsText, q.qtype);
        if (ze) {
          letters = mapLetters(ze, q.opts, q.qtype);
          if (letters.length) from = 'ZError';
        }
      }
      // ② 言溪
      if (!letters.length && getYanxi()) {
        const yr = await askYanxi(q.title, optionsText, q.qtype);
        if (yr.answer) {
          letters = mapLetters(yr.answer, q.opts, q.qtype);
          if (letters.length) from = '言溪';
        }
      }
      // ③ DeepSeek 直连
      if (!letters.length && getAiKey()) {
        const ai = await askDeepSeek(q.title, optionsText, q.qtype);
        if (ai) {
          letters = mapLetters(ai, q.opts, q.qtype);
          if (letters.length) from = 'DeepSeek';
        }
      }
      // ④ 本地题库（只有启用时才连）
      if (!letters.length && bankEnabled()) {
        try {
          const ans = await askBank(q.title, optionsText, q.qtype);
          if (ans) {
            letters = mapLetters(ans, q.opts, q.qtype);
            if (letters.length) from = '本地题库';
          }
        } catch (e) {
          warn('查本地题库失败：' + e.message);
        }
      }
      if (!letters.length) { warn('所有题库都没给出答案，跳过这题'); return; }

      for (const L of letters) {
        const hit = q.opts.find((o) => o.letter === L);
        if (hit) await checkOption(hit);
      }
      log('已选 ' + letters.join('') + '（来自' + from + '），点「' + ((q.submit && q.submit.innerText) || '').replace(/\s+/g, '') + '」');
      if (q.submit) q.submit.click();
    } finally {
      practiceBusy = false;
    }
  }

  // 弹窗是否真的可见：隐藏的残留表单不算，否则脚本会永远停手
  function quizVisible() {
    const sub = document.querySelector('form .sub-title');
    if (!sub) return false;
    const el = sub.closest('form') || sub;
    if (el.offsetParent === null) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }

  // ---------- 主循环 ----------
  setInterval(() => {
    if (!running) return;
    const open = quizVisible();
    if (!open) {
      try { ensurePlaying(); } catch (e) { console.warn('[sakt] tick', e); }
    }
    try { handleQuiz(); } catch (e) { console.warn('[sakt] quiz', e); }
    try { handlePractice(); } catch (e) { console.warn('[sakt] practice', e); }
  }, CONFIG.tickMs);

  setInterval(bindVideo, 2000);

  const api = {
    start() { running = true; log('已恢复'); },
    stop() { running = false; log('已暂停'); },
    chapters() {
      const nodes = chapterNodes();
      console.table(nodes.map((n, i) => ({ i, text: nodeText(n).slice(0, 50) })));
      return nodes.length;
    },
    quiz() { return handleQuiz(); },
    probe() {
      const stemEls = [...document.querySelectorAll('.stem')];
      const rows = [...document.querySelectorAll('.ant-radio-wrapper, label')]
        .filter((el) => el.querySelector('input')).slice(0, 8);
      return {
        stemCount: stemEls.length,
        stemText: stemEls[0] ? (stemEls[0].innerText || '').replace(/\s+/g, ' ').slice(0, 60) : '',
        inputCount: document.querySelectorAll('input[type=radio], input[type=checkbox]').length,
        bodyHasQuestion: /第\s*\d+\s*题/.test(document.body.innerText || ''),
        rows: rows.map((r) => ({
          tag: r.tagName,
          cls: String(r.className).slice(0, 30),
          parentText: (r.parentElement && r.parentElement.innerText || '').replace(/\s+/g, ' ').slice(0, 30),
          selfText: (r.innerText || '').replace(/\s+/g, ' ').slice(0, 30),
        })),
        practiceParse: (() => { try { const q = extractPracticeGlobal(); return q ? { title: q.title.slice(0, 40), opts: q.opts.map(o => o.letter + '=' + o.text) } : null; } catch (e) { return String(e); } })(),
      };
    },
    expandCats() { return expandAllCategories(); },
    setYanxiConfig(text) {
      const p = parseYanxiInput(text);
      setYanxi(p.token);
      setYanxiUrl(p.url);
      log('言溪已保存：' + (p.token ? p.token.slice(0, 4) + '****' : '无 token') + ' @ ' + getYanxiUrl());
    },
    askYanxiToken,
    getYanxi,
    getYanxiUrl,
    askYanxi(title, opts, type) { return askYanxi(title, opts, type); },
    setZerror(url) {
      try {
        if (url) localStorage.setItem(ZERROR_URL_KEY, url);
        else localStorage.removeItem(ZERROR_URL_KEY);
      } catch (e) {}
      log('ZError 地址：' + (getZerrorUrl() || '未设置'));
    },
    getZerrorUrl,
    askZerror(title, opts, type) { return askZerror(title, opts, type); },
    setAiKey(k) {
      setAiKey(k);
      log('DeepSeek Key：' + (getAiKey() && !getAiKey().startsWith('__') ? '已设置' : '已清除'));
    },
    getAiKey,
    askDeepSeek(title, opts, type) { return askDeepSeek(title, opts, type); },
    config: CONFIG,
  };

  // 同时挂到隔离环境和页面真实 window，控制台才能直接调
  window.__sakt = api;
  try { PAGE.__sakt = api; } catch (e) {}

  try {
    if (typeof GM_registerMenuCommand === 'function') {
      GM_registerMenuCommand('设置言溪题库配置', askYanxiToken);
      GM_registerMenuCommand('设置 ZError 地址', function () {
        const cur = getZerrorUrl();
        const v = prompt('ZError 查询地址（留空=不启用）\n例如 http://127.0.0.1:3000/query', cur);
        if (v === null) return;
        api.setZerror(v.trim());
      });
      GM_registerMenuCommand('设置 DeepSeek Key', function () {
        const cur = getAiKey();
        const v = prompt('DeepSeek API Key（留空=清除）\n例如 sk-xxxxxxxx',
          (cur && !cur.startsWith('__')) ? cur : '');
        if (v === null) return;
        api.setAiKey(v.trim());
      });
    }
  } catch (e) {}

  const aiOn = getAiKey() && !getAiKey().startsWith('__');
  log('已启动 v3.0（ZError+言溪版）：rate=' + CONFIG.rate + '，autoNext=' + CONFIG.autoNext + '，answerQuiz=' + CONFIG.answerQuiz);
  log('ZError：' + (getZerrorUrl() || '未设置') + ' ｜ 言溪：' + (getYanxi() ? '已设置' : '未设置') +
    ' ｜ DeepSeek：' + (aiOn ? '已设置' : '未设置'));
  log('章节识别：window.__sakt.chapters()');

  if (CONFIG.answerQuiz && !getYanxi() && !getZerrorUrl() && !aiOn) {
    setTimeout(() => {
      warn('ZError / 言溪 / DeepSeek 都没配置，答题只能走本地题库');
    }, 1200);
  }

  ensurePlaying();
  bindVideo();
})();
</script>

  <script>
    function pickZerror(raw) {
      var v = (raw || '').trim();
      if (!v) return '';
      if (v.charAt(0) === '{' || v.charAt(0) === '[') {
        try {
          var o = JSON.parse(v);
          if (Array.isArray(o)) o = o[0] || {};
          return (o.url || '').trim();
        } catch (e) { return ''; }
      }
      return v;
    }

    function gen() {
      var ze = pickZerror(document.getElementById('ze').value);
      var yx = (document.getElementById('yx').value || '').trim();
      var ai = (document.getElementById('ai').value || '').trim();
      var rate = document.getElementById('rate').value;
      var tpl = document.getElementById('tpl').textContent;

      if (ze) tpl = tpl.split('__ZERROR_URL__').join(ze);
      if (yx) tpl = tpl.split('__YANXI_TOKEN__').join(yx);
      if (ai) tpl = tpl.split('__AI_KEY__').join(ai);
      tpl = tpl.replace(/rate: 8,/, 'rate: ' + rate + ',');

      var d = new Date();
      var stamp = '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
      tpl = tpl.replace('// @version      3.0', '// @version      3.0.' + stamp);

      var blob = new Blob([tpl], { type: 'text/javascript;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sakt-autoplay.user.js';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);

      document.getElementById('msg').textContent = '已生成：' +
        (ze ? 'ZError=' + ze + '、' : 'ZError 未启用、') +
        (yx ? '言溪已内置、' : '言溪未内置、') +
        (ai ? 'DeepSeek 已内置、' : 'DeepSeek 未内置、') +
        '倍速 ' + rate + '×';
    }
  </script>
</body>
